[package]
name = "rz"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Save and restore native Ghostty workspaces on macOS"
license = "MIT"
repository = "https://github.com/marianposaceanu/rz"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
getrandom = "0.3"
hostname = "0.4"
nix = { version = "0.30", features = ["process", "signal"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
lto = true
codegen-units = 1
