[package]
name = "rz"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
description = "Save and restore native Ghostty workspaces on macOS"
license = "MIT"
repository = "https://github.com/marianposaceanu/rz"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
hostname = "0.4"
humantime = "2.4"
lz4_flex = "0.14.2"
nix = { version = "0.32", features = ["process", "signal"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4"
terminal_size = "0.4"
tempfile = "3.27"

[profile.release]
strip = true
lto = true
codegen-units = 1
